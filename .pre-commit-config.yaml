repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: end-of-file-fixer
        exclude: '\.json$'
    -   id: trailing-whitespace
        exclude: '\.json$'
    -   id: check-yaml
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
    -   id: actionlint
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
    -   id: ruff-check
        args: ['--fix']
    -   id: ruff-format
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
    -   id: mypy
        # Settings live in pyproject.toml so the hook and `make typecheck`
        # cannot drift apart.
        args: ['--config-file', 'pyproject.toml']
        files: '^(cs2posts/|main\.py|save\.py)'
        additional_dependencies: ['httpx', 'python-telegram-bot', 'aiosqlite']
